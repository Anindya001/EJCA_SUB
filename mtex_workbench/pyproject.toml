[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mtex-workbench"
version = "0.1.0"
description = "A desktop workbench for crystallographic and metallographic analysis built on MTEX for Python"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.12"
dependencies = [
  "mtex[io,plot,numba]>=1.0",
  "numpy>=2.0",
  "scipy>=1.13",
  "matplotlib>=3.8",
  "h5py>=3",
  "pillow>=10",
]

[project.optional-dependencies]
gui = ["pyside6>=6.6"]
test = ["pytest>=8.0"]

[project.scripts]
mtex-workbench = "mtex_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  # matplotlib's Qt backend still sets an attribute Qt 6 deprecated
  "ignore:Enum value .Qt..ApplicationAttribute.AA_UseHighDpiPixmaps:DeprecationWarning",
]
markers = [
  "mtex_data: needs the MTEX sample data (downloaded on first use)",
  "gui: needs PySide6 and a Qt platform (offscreen works)",
]
